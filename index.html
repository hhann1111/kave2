<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Kávé</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 1px solid white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-buttons a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            border: 1px solid white;
            padding: 5px 10px;
            transition: 0.3s;
        }

        .nav-buttons a:hover {
            background-color: white;
            color: black;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70vh;
        }

        img {
            max-width: 300px;
            width: 100%;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            border-top: 1px solid white;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">KÁVÉ</div>
    <div class="nav-buttons">
        <a href="#">Home</a>
        <a href="#">Gallery</a>
    </div>
</header>

<main>
    <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348" alt="Kávébab">
</main>

<footer>
    szeresd a kávét :)
</footer>

</body>
</html>
